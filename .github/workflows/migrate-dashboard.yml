name: Migrate standalone XLX dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-dashboard.yml'
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'push' || github.event.issue.title == 'RUN DASHBOARD MIGRATION'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy dashboard-only branch and validate public scope
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          git clone --depth 1 --branch dashboard-only \
            https://github.com/PU2PNY/XLX-Modern-Installer.git \
            "$tmp/source"

          rsync -a --delete --exclude='.git/' "$tmp/source/" ./

          rm -f assets/logo-xlx026.jpeg config/site.php
          rm -f MIGRATION_TEST.txt MIGRATION_OBJECT_TEST.txt MIGRATION_OBJECT_TEST_2.txt

          if [ -f assets/project-link.js ]; then
            sed -i \
              's#https://github.com/PU2PNY/XLX-Modern-Installer/tree/dashboard-only#https://github.com/PU2PNY/XLX-Modern-Dashboard#g; s#https://github.com/PU2PNY/XLX-Modern-Installer#https://github.com/PU2PNY/XLX-Modern-Dashboard#g' \
              assets/project-link.js
          fi

          if [ -f README.md ]; then
            sed -i 's/This branch contains only/This repository contains only/' README.md
          fi

          forbidden_paths=(control modules runtime vendor install.sh config/site.php)
          for path in "${forbidden_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "ERROR: forbidden public path found: $path" >&2
              exit 1
            fi
          done

          if find . -path './.git' -prune -o -type f \( -name '.env' -o -name '.env.*' -o -name '*.secret.php' \) -print | grep -q .; then
            echo 'ERROR: secret/local configuration file found.' >&2
            exit 1
          fi

          if grep -RIl --exclude-dir=.git -- 'xlx026.net' . | grep -q .; then
            echo 'ERROR: XLX026 production domain reference found.' >&2
            exit 1
          fi

          if [ -d install ]; then
            find install -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          fi

          git config user.name 'PU2PNY'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi

          git commit -m 'feat: publish standalone XLX modern dashboard'
          git push origin HEAD:main
