name: Import generic public certificate module

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-certificate-module.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy public certificate module
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone --depth 1 https://github.com/PU2PNY/XLX-Modern-Installer.git "$tmp/src"
          cp "$tmp/src/extras/certificados/certificado-config.php" ./certificado-config.php
          cp "$tmp/src/extras/certificados/certificado-validar.php" ./certificado-validar.php
          cp "$tmp/src/extras/certificados/api/certificado.php" ./api/certificado.php
          cp "$tmp/src/extras/certificados/assets/certificado.css" ./assets/certificado.css
          cp "$tmp/src/extras/certificados/assets/certificado.js" ./assets/certificado.js
          cat > certificado-view.php <<'PHP'
          <?php
          declare(strict_types=1);
          require_once __DIR__ . '/certificado-config.php';
          $reflector = cert_reflector();
          $campaign = cert_current_campaign();
          ?>
          <section class="cert-shell">
            <header class="cert-page-header">
              <div>
                <span class="cert-kicker">CERTIFICADOS DE PARTICIPAÇÃO</span>
                <h1><?=htmlspecialchars($reflector['title'], ENT_QUOTES, 'UTF-8')?></h1>
                <p><?=htmlspecialchars($campaign['title'], ENT_QUOTES, 'UTF-8')?> • <?=htmlspecialchars($campaign['period_label'], ENT_QUOTES, 'UTF-8')?></p>
              </div>
            </header>
            <section class="cert-search-card">
              <label for="certCallsign">Digite seu indicativo</label>
              <div class="cert-search-row">
                <input id="certCallsign" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Ex.: N0CALL">
                <button id="certSearch" type="button">Verificar participação</button>
              </div>
              <p id="certMessage" class="cert-message" aria-live="polite"></p>
            </section>
            <section id="certPreview" class="certificate" hidden>
              <div class="certificate-border">
                <div class="certificate-topline"></div>
                <div class="certificate-brand"><?=htmlspecialchars($reflector['title'], ENT_QUOTES, 'UTF-8')?></div>
                <div class="certificate-special"><?=htmlspecialchars($campaign['title'], ENT_QUOTES, 'UTF-8')?></div>
                <h2>Certificado de Participação</h2>
                <p class="certificate-intro">Certificamos a participação do radioamador</p>
                <div id="certName" class="certificate-name"></div>
                <div id="certCall" class="certificate-call"></div>
                <p id="certText" class="certificate-text"></p>
                <div class="certificate-stats">
                  <div><strong id="statTx">0</strong><span>transmissões</span></div>
                  <div><strong id="statTime">0s</strong><span>tempo no ar</span></div>
                  <div><strong id="statModes">—</strong><span>protocolos</span></div>
                </div>
                <div class="certificate-footer">
                  <div><span>Validação</span><strong id="certId">—</strong><small id="certIssued"></small></div>
                  <div id="certQr" class="certificate-qr"></div>
                  <div class="certificate-signature"><span>Responsável</span><strong><?=htmlspecialchars($reflector['sysop_callsign'], ENT_QUOTES, 'UTF-8')?></strong><small><?=htmlspecialchars($reflector['title'], ENT_QUOTES, 'UTF-8')?></small></div>
                </div>
              </div>
            </section>
            <div id="certActions" class="cert-actions" hidden>
              <button id="certIssue" type="button">Emitir certificado</button>
              <button id="certPrint" type="button" disabled>Imprimir / Salvar PDF</button>
            </div>
          </section>
          <script>
          window.XLX_CERT = <?=json_encode(['api'=>'api/certificado.php','reflector'=>$reflector,'campaign'=>$campaign], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)?>;
          </script>
          <script src="assets/certificado.js?v=1" defer></script>
          PHP
          php -l certificado-config.php
          php -l certificado-validar.php
          php -l certificado-view.php
          php -l api/certificado.php
          git config user.name 'PU2PNY'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git add certificado-config.php certificado-validar.php certificado-view.php api/certificado.php assets/certificado.css assets/certificado.js
          git commit -m 'feat: add generic certificate page and service'
          git push origin HEAD:main
